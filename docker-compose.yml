services:
  db:
    image: postgres:17
    container_name: sealedto-postgres
    restart: unless-stopped
    ports:
      - "54323:5432"
    environment:
      POSTGRES_USER: sealedto
      POSTGRES_PASSWORD: sealedto
      POSTGRES_DB: sealedto
    volumes:
      - sealedto_pgdata:/var/lib/postgresql/data

volumes:
  sealedto_pgdata:
